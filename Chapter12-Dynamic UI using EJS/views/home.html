<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb</title>

    <link rel="stylesheet" href="/css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-md">

        <nav class="max-w-7xl mx-auto px-6">

            <ul class="w-full flex items-center justify-between py-4">

                <!-- Logo -->
                <li>
                    <a 
                        href="/"
                        class="text-3xl font-bold text-red-500"
                    >
                        Airbnb
                    </a>
                </li>

                <!-- Navigation Links -->
                <li class="flex items-center gap-8">

                    <a
                        href="/"
                        class="text-gray-700 font-medium hover:text-red-500"
                    >
                        Home
                    </a>

                    <a
                        href="/host/add-home"
                        class="text-gray-700 font-medium hover:text-red-500"
                    >
                        Add Home
                    </a>

                </li>

            </ul>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="min-h-[calc(100vh-73px)] flex items-center justify-center px-4">

        <div class="bg-white w-full max-w-lg p-10 rounded-xl shadow-lg text-center">

            <h1 class="text-4xl font-bold text-red-500 mb-8">
                Welcome to Airbnb
            </h1>

            <a
                href="/host/add-home"
                class="inline-block bg-red-500 text-white px-7 py-3 rounded-lg font-semibold hover:bg-red-600 transition"
            >
                Add Home
            </a>

        </div>

    </main>

</body>
</html>
