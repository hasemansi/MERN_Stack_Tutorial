<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb - Page Not Found</title>

    <link rel="stylesheet" href="/css/output.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-10 rounded-lg shadow-md text-center">

        <h1 class="text-6xl font-bold text-red-500 mb-4">
            404
        </h1>

        <h2 class="text-2xl font-bold text-gray-800 mb-3">
            Page Not Found
        </h2>

        <p class="text-gray-600 mb-6">
            The page you are looking for does not exist.
        </p>

        <a
            href="/"
            class="inline-block bg-red-500 text-white px-6 py-3 rounded-md font-semibold hover:bg-red-600"
        >
            Go Back
        </a>

    </div>

</body>
</html>
