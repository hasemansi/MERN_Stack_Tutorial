<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb</title>

    <link rel="stylesheet" href="/css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-red-500 text-white py-5">
        <h1 class="text-3xl font-bold text-center">
            Airbnb
        </h1>
    </header>

    <main class="flex items-center justify-center min-h-[80vh]">

        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">

            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
                Register Your Home
            </h2>

            <form action="/host/add-home" method="POST">

                <div class="mb-5">
                    <label
                        for="homeName"
                        class="block text-gray-700 font-semibold mb-2"
                    >
                        Home Name:
                    </label>

                    <input
                        type="text"
                        id="homeName"
                        name="homeName"
                        placeholder="Enter your Home Name"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-red-500 text-white py-3 rounded-md font-semibold hover:bg-red-600"
                >
                    Submit
                </button>

            </form>

        </div>

    </main>

</body>
</html>
